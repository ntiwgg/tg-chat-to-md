[project]
name = "tg-chat-to-md"
version = "0.1.0"
description = "Convert Telegram chat exports to Markdown with local Whisper speech-to-text"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "telegram",
    "whisper",
    "speech-to-text",
    "transcription",
    "markdown",
    "cli",
]
dependencies = [
    "faster-whisper>=1.0",
    "tqdm>=4.0",
]

[project.scripts]
tg-chat-to-md = "tg_chat_to_md.cli:main"
tg-chat-merge = "tg_chat_to_md.merge:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["tg_chat_to_md*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# CUDA libs must be preloaded before tg_chat_to_md.transcriber imports faster-whisper.
"tg_chat_to_md/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["tg_chat_to_md"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
# One-shot quality audit (Phase 4): mutate the tg_chat_to_md package, run the
# real test suite against every mutant. Mutation score is a review input, not
# a CI gate.
source_paths = ["tg_chat_to_md/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The golden sample data must follow the mutated sources into the mutants/
# sandbox or its tests cannot run.
also_copy = ["examples"]

[tool.coverage.run]
source = ["tg_chat_to_md"]

[tool.coverage.report]
fail_under = 95
