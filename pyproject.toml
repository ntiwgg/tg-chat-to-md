[project]
name = "telegramanal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "tqdm>=4.0",
]

[project.scripts]
telegram-to-md = "telegram_to_md:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools]
py-modules = ["telegram_to_md", "merge_exports"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# CUDA libs must be preloaded before src.transcriber imports faster-whisper.
"telegram_to_md.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src", "telegram_to_md.py", "merge_exports.py"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 95
