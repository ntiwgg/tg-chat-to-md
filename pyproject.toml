[project]
name = "telegramanal"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.0",
    "tqdm>=4.0",
]

[project.scripts]
telegram-to-md = "telegram_to_md:main"

[tool.setuptools]
py-modules = ["telegram_to_md", "merge_exports"]

[tool.setuptools.packages.find]
include = ["src*"]
